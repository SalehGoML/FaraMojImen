version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/queries"
    schema: "./migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "./internal/sqlcgen"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_sql_as_comment: true
        null_style: "option"
